<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Pharoah ERP Web Workstation</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #0F172A; margin: 0; padding: 0;">
  <script>
    // 1. Force unregister all legacy service workers
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    // 2. Force delete all browser cache storage
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
    // 3. Dynamically inject flutter_bootstrap.js with unique timestamp to guarantee 100% fresh load
    var script = document.createElement('script');
    script.src = 'flutter_bootstrap.js?v=' + new Date().getTime();
    script.async = true;
    document.body.appendChild(script);
  </script>
</body>
</html>
